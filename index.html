<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Log</title>
  <meta name="description" content="Personal workout logger for Push, Pull and Legs.">
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Main">
    <button data-tab="train" type="button">Train</button>
    <button data-tab="progress" type="button">Progress</button>
    <button data-tab="plan" type="button">Plan</button>
    <button data-tab="history" type="button">History</button>
    <button data-tab="more" type="button">More</button>
  </nav>
  <div id="toast" role="status"></div>
  <noscript><p style="padding:16px">Lift Log needs JavaScript.</p></noscript>
  <script src="data.js?v=1"></script>
  <script src="charts.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
